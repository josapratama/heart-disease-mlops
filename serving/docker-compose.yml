# ────────────────────────────────────────────────────────────
# Docker Compose untuk Heart Disease ML System
# Services: Flask App + Prometheus + Grafana
# ────────────────────────────────────────────────────────────

services:
  # ── Flask App (model serving) ───────────────────────────
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heart_disease_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MODEL_DIR=/app/model/heart_disease_model/1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Prometheus ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: heart_disease_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      - flask-app

  # ── Grafana ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.1.0
    container_name: heart_disease_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
