global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus sendiri
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Monitor Flask app (heart disease model)
  - job_name: "heart-disease-app"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["flask-app:5000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "heart_disease_model"
